name: Bug report
description: Something does not work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        **Never paste a real password, authenticator key or vault backup into an issue.**
        If the problem could expose someone's data, report it privately instead: see the security policy.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Unlock the vault
        2. Open an item
        3. ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Firefox 144 on Windows 11
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Enclave version or commit
      placeholder: 0.1.0, or a commit hash
